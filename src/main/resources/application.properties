server.port=8080

# Local file-based H2 store: queue state, offsets and dead letters survive restarts.
spring.datasource.url=jdbc:h2:file:./data/taskqueue;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Queue semantics configuration
taskqueue.max-attempts=3
taskqueue.backoff-millis=1000
taskqueue.backoff-multiplier=2.0
taskqueue.ack-timeout-millis=30000
taskqueue.reaper-interval-millis=5000
