# 随机端口启动；如要固定端口改为具体数字，例如 server.port=8080
server.port=0

# ===== 本地任务消息队列配置（前缀 taskqueue）=====
# 持久化快照目录（JSON 快照，原子 rename 覆盖写）
taskqueue.data-dir=data/taskqueue
# 拉取后的确认租约时长（毫秒），超时未 ack 视为消费失败并重新投递
taskqueue.visibility-timeout-ms=10000
# 最大投递尝试次数（含首次），超过后消息进入死信
taskqueue.max-attempts=5
# 重试退避基础时长（毫秒）
taskqueue.backoff-base-ms=1000
# 退避策略：FIXED | LINEAR | EXPONENTIAL
taskqueue.backoff-strategy=EXPONENTIAL
# 租约超时回收扫描间隔（毫秒）
taskqueue.reaper-interval-ms=1000
