# Tests use an isolated in-memory H2 database and a fast reaper.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

taskqueue.max-attempts=3
taskqueue.backoff-millis=100
taskqueue.backoff-multiplier=2.0
taskqueue.ack-timeout-millis=30000
taskqueue.reaper-interval-millis=1000
